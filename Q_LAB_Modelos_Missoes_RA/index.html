<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q-LAB | Missões Moleculares</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><style>body{font-family:system-ui;background:#f0f7fa;color:#163449;max-width:920px;margin:auto;padding:20px}header{background:#0b5473;color:white;padding:22px;border-radius:16px}section{background:white;border-radius:14px;margin:18px 0;padding:18px;box-shadow:0 2px 9px #ccd}model-viewer{width:100%;height:330px;background:#eaf3f6;border-radius:12px}button{background:#086d95;color:white;border:0;border-radius:10px;padding:12px;cursor:pointer}small{color:#455}a{color:#075e83}</style></head><body><header><h1>Q-LAB · Missão Molecular 3D</h1><p>Gire os modelos, aproxime e use o botão de realidade aumentada quando disponível.</p></header><p><b>Atenção:</b> a RA depende de HTTPS e de um dispositivo compatível. O modo 3D funciona como alternativa. Os modelos são didáticos e simplificados; os pares isolados não são representados.</p><main id="models"></main><script>
const data={"agua_H2O": ["Água", "Angular", "sp³", "104,5°", "Missões 1 e 2"], "metano_CH4": ["Metano", "Tetraédrica", "sp³", "109,5°", "Missões 3 e 5"], "gas_carbonico_CO2": ["Dióxido de carbono", "Linear", "sp", "180°", "Missão 4"], "amonia_NH3": ["Amônia", "Piramidal trigonal", "sp³", "~107°", "Missão 5"], "eteno_C2H4": ["Eteno", "Trigonal plana (em cada C)", "sp²", "~120°", "Missão 6"], "etino_C2H2": ["Etino", "Linear (em cada C)", "sp", "180°", "Missão 6"], "cloreto_berilio_BeCl2": ["Cloreto de berílio", "Linear", "sp", "180°", "Missão 7"], "fluoreto_boro_BF3": ["Trifluoreto de boro", "Trigonal plana", "sp²", "120°", "Missão 7"], "rede_ionica_NaCl": ["Cloreto de sódio", "Rede iônica", "Não se aplica", "—", "Missão 1"], "rede_metalica_Cu": ["Cobre", "Rede metálica", "Não se aplica", "—", "Missão 1"]};
const holder=document.querySelector('#models');
for(const [file,info] of Object.entries(data)){
const sec=document.createElement('section');sec.id=file;
sec.innerHTML=`<h2>${info[0]}</h2><p><b>Geometria:</b> ${info[1]} · <b>Hibridização:</b> ${info[2]} · <b>Ângulo:</b> ${info[3]}</p><p><small>${info[4]}</small></p><model-viewer src="${file}.glb" alt="Modelo tridimensional de ${info[0]}" camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look" shadow-intensity="1"><button slot="ar-button">Ver em realidade aumentada</button></model-viewer><p><a href="${file}.glb" download>Baixar modelo GLB</a></p>`;
holder.appendChild(sec);
}
</script></body></html>
